{% extends "base.html" %}
{% block title %}Set password{% endblock %}
{% block content %}
<div class="max-w-lg">
  <a href="{% url 'accounts:user_list' %}" class="link link-hover text-sm">← Users</a>
  <h1 class="text-2xl font-bold mb-4 mt-1">Set password for {{ target.username }}</h1>
  <form method="post" class="card bg-base-100 shadow-sm"><div class="card-body">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="card-actions justify-end mt-4"><button class="btn btn-primary" type="submit">Set password</button></div>
  </div></form>
</div>
{% endblock %}
