{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block main_class %}min-h-screen grid place-items-center px-4{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-md w-full max-w-sm">
  <div class="card-body">
    <div class="flex items-center gap-2 mb-2">
      <span class="inline-grid place-items-center w-9 h-9 rounded-lg bg-primary text-primary-content font-bold">AR</span>
      <h1 class="text-xl font-semibold">Amazon Reports</h1>
    </div>
    <form method="post" class="space-y-1">
      {% csrf_token %}
      {% include "_form_fields.html" %}
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="btn btn-primary w-full mt-4">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
