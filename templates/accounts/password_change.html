{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="max-w-lg">
  <h1 class="text-2xl font-bold mb-4">Change your password</h1>
  <form method="post" class="card bg-base-100 shadow-sm"><div class="card-body">
    {% csrf_token %}
    {% include "_form_fields.html" %}
    <div class="card-actions justify-end mt-4"><button class="btn btn-primary" type="submit">Change password</button></div>
  </div></form>
</div>
{% endblock %}
