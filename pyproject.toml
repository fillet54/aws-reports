[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-reporting"
version = "0.2.0"
description = "Amazon sales reporting for multiple brands (Django)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phillip Gomez", email = "fillet54@gmail.com" }]

dependencies = [
  "django>=5.2,<6",
  "dj-database-url>=2.2",
  "whitenoise>=6.7",
  "gunicorn>=23",
  "cryptography>=43",
  "psycopg[binary]>=3.2",
  "python-amazon-sp-api>=1.8",
  "python-amazon-ad-api>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "apps*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
testpaths = ["tests"]
